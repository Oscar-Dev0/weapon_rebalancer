<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="system-ui, Segoe UI, Arial, sans-serif" role="img" aria-label="Orden en que el motor resuelve el valor de un campo">
  <rect width="820" height="330" rx="14" fill="#0e1120"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8187ad"/></marker></defs>
  <g font-size="12" fill="#e8eaf7">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#a78bfa">CÓMO SE RESUELVE EL VALOR DE UN CAMPO (de abajo hacia arriba gana el último)</text>
    <g>
      <rect x="24" y="50" width="240" height="40" rx="9" fill="#131729" stroke="#8187ad"/><text x="38" y="75">1 · Valor actual del META (o .bak)</text>
      <rect x="24" y="100" width="240" height="40" rx="9" fill="#191e35" stroke="#3b82f6"/><text x="38" y="125">2 · Global (defaults.fields)</text>
      <rect x="24" y="150" width="240" height="40" rx="9" fill="#191e35" stroke="#3b82f6"/><text x="38" y="175">3 · Categoría o preset interno</text>
      <rect x="24" y="200" width="240" height="40" rx="9" fill="#131729" stroke="#8187ad"/><text x="38" y="225">4 · Config por carpeta (.json)</text>
      <rect x="24" y="250" width="240" height="40" rx="9" fill="#191e35" stroke="#8b5cf6"/><text x="38" y="275">5 · Arma (weapons.WEAPON_X)</text>
    </g>
    <g>
      <rect x="300" y="50" width="240" height="40" rx="9" fill="#191e35" stroke="#a78bfa"/><text x="314" y="75">6 · Módulos (original / presets)</text>
      <rect x="300" y="100" width="240" height="40" rx="9" fill="#191e35" stroke="#a78bfa"/><text x="314" y="125">7 · Reparación base (baseline)</text>
      <rect x="300" y="150" width="240" height="40" rx="9" fill="#191e35" stroke="#a78bfa"/><text x="314" y="175">8 · Custom, cadencia, multiplicadores</text>
      <rect x="300" y="200" width="240" height="40" rx="9" fill="#191e35" stroke="#a78bfa"/><text x="314" y="225">9 · Reglas por familia</text>
      <rect x="300" y="250" width="240" height="40" rx="9" fill="#191e35" stroke="#a78bfa"/><text x="314" y="275">10 · Política de cabeza / one-tap</text>
    </g>
    <g>
      <rect x="576" y="100" width="220" height="40" rx="9" fill="#131729" stroke="#f59e0b"/><text x="590" y="125">11 · Armas inofensivas (daño 0)</text>
      <rect x="576" y="150" width="220" height="40" rx="9" fill="#131729" stroke="#ef4444"/><text x="590" y="175">12 · Límites del motor (recorte)</text>
      <rect x="576" y="200" width="220" height="40" rx="9" fill="#131729" stroke="#22c55e"/><text x="590" y="225">13 · Tags XML exactos + flags</text>
      <rect x="576" y="250" width="220" height="40" rx="9" fill="#0b2a1a" stroke="#22c55e"/><text x="590" y="275" font-weight="700">= valor escrito en el META</text>
    </g>
  </g>
  <g stroke="#8187ad" stroke-width="1.5" fill="none" marker-end="url(#b)">
    <path d="M264 270C282 270 282 70 298 70"/><path d="M540 270C558 270 558 120 574 120"/>
  </g>
</svg>
